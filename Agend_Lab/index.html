<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)">
  <title>Agend Lab</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <h1>Agend Lab</h1>
    <div class="workbench">
      <section class="controls" aria-label="Model controls and selected agent">
        <form id="model-form">
          <label for="scenario" class="scenario-choice">Model
            <select id="scenario" name="scenario">
              <option value="diffusion" selected>Network diffusion</option>
              <option value="exchange">Exchange</option>
              <option value="lifecycle">Lifecycle</option>
            </select>
          </label>
          <label for="topology" class="scenario-choice">Network
            <select id="topology" name="topology"><option value="communities">Communities</option><option value="ring">Ring</option><option value="hub">Hub</option></select>
          </label>
          <label for="population">Agents<input id="population" name="population" type="number" min="3" max="200" step="1" value="60" autocomplete="off" inputmode="numeric" required></label>
          <label for="seed">Seed<input id="seed" name="seed" type="number" min="-2147483648" max="4294967295" step="1" value="1" autocomplete="off" inputmode="numeric" required></label>
          <label for="transmission">Transmission<input id="transmission" name="transmission" type="number" min="0" max="1" step="0.05" value="0.35" autocomplete="off" inputmode="decimal" required></label>
          <label for="active-ticks">Active ticks<input id="active-ticks" name="activeTicks" type="number" min="1" max="30" step="1" value="6" autocomplete="off" inputmode="numeric" required></label>
          <label for="initial-energy" hidden>Initial energy<input id="initial-energy" name="initialEnergy" type="number" min="0" max="1000000" step="1" value="10" autocomplete="off" inputmode="numeric" required disabled></label>
          <button type="submit">New model</button>
        </form>
        <div class="actions" id="diffusion-actions">
          <button id="run-model" type="button" aria-pressed="false">Run</button>
          <button id="activate-selected" type="button">Activate selected</button>
          <label class="checkbox-label"><input id="bridges" name="bridges" type="checkbox" checked> Community bridges</label>
        </div>
        <dl aria-label="Selected agent state">
          <dt>Selected</dt><dd><output id="identity" aria-label="Agent identity"></output></dd>
          <dt data-diffusion>State</dt><dd data-diffusion><output id="diffusion-state" aria-label="Selected diffusion state"></output></dd>
          <dt data-diffusion>Group</dt><dd data-diffusion><output id="community" aria-label="Selected community"></output></dd>
          <dt data-diffusion>Contacts</dt><dd data-diffusion><output id="degree" aria-label="Selected degree"></output></dd>
          <dt data-legacy>Energy</dt><dd data-legacy><output id="energy" aria-label="Energy"></output></dd>
          <dt data-legacy>Agent</dt><dd data-legacy><output id="alive" aria-label="Agent status"></output></dd>
          <dt data-legacy>Membership</dt><dd data-legacy><output id="membership" aria-label="Membership"></output></dd>
          <dt data-legacy>x, y · heading</dt><dd data-legacy><output id="position" aria-label="Model coordinates and heading"></output></dd>
        </dl>
        <p id="execution-target"></p>
        <div id="model-actions" class="actions" role="group" aria-label="Model actions">
          <button id="one-step" type="button">1 step</button>
          <button id="five-steps" type="button">5 steps</button>
          <button id="hundred-steps" type="button">100 steps</button>
          <button id="membership-action" type="button" data-legacy>Detach</button>
          <button id="copy" type="button" data-legacy>Copy</button>
          <button id="delete" type="button" data-legacy>Delete</button>
          <button id="fail" type="button" data-legacy>Fail step</button>
        </div>
        <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
      </section>
      <figure aria-label="Non-spatial agent network">
        <figcaption>
          <span>Network · non-spatial layout</span>
          <span class="view-stats">
            <span>Agents<output id="count" aria-label="World agent count"></output></span>
            <span>Tick<output id="tick" aria-label="Tick"></output></span>
            <span id="contact-count-wrap">Contacts<output id="contact-count" aria-label="Contact count"></output></span>
            <span id="total-energy-wrap" hidden>Total energy<output id="total-energy" aria-label="Total population energy"></output></span>
            <span id="energy-range-wrap" hidden>Range<output id="energy-range" aria-label="Population energy range"></output></span>
            <span id="seed-wrap">Seed<output id="current-seed" aria-label="Current model seed"></output></span>
          </span>
        </figcaption>
        <div class="network-toolbar" role="group" aria-label="Network display actions">
          <button id="fit-network" type="button">Fit view</button>
          <button id="reset-layout" type="button">Reset layout</button>
          <p id="interaction"></p>
        </div>
        <div id="network-view" role="img" aria-label="Agent network"></div>
        <div id="diffusion-summary">
          <div class="state-legend" aria-label="Diffusion states">
            <span class="state-unaware">Unaware <output id="unaware-count" aria-label="Unaware count"></output></span>
            <span class="state-active">Active <output id="active-count" aria-label="Active count"></output></span>
            <span class="state-settled">Settled <output id="settled-count" aria-label="Settled count"></output></span>
            <span class="bridge-key">Dashed: community bridge</span>
          </div>
          <svg id="count-trend" viewBox="0 0 600 100" role="img" aria-label="Population history" preserveAspectRatio="none"></svg>
        </div>
        <details class="agent-list">
          <summary>Agent list</summary>
          <div id="agent-view" role="group" aria-label="Select an agent to inspect"></div>
        </details>
      </figure>
    </div>
  </main>
</body>
</html>
