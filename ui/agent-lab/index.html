<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#181818"
      media="(prefers-color-scheme: dark)"
    />
    <title>Agent Lab</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a href="#experiment-content" class="skip-link">Skip to experiment</a>
    <main>
      <header>
        <h1>Agent Lab</h1>
        <label for="experiment" class="sr-only">Experiment</label
        ><select id="experiment" aria-label="Experiment"></select>
      </header>
      <p id="catalog-status" role="status" aria-live="polite"></p>
      <section
        id="experiment-content"
        aria-label="Experiment workbench"
      ></section>
    </main>
  </body>
</html>
