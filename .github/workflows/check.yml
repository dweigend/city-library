name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'integration/**'
      - experiment/netlogo-web-catalog

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.2
      - run: bun install --frozen-lockfile
      - run: bun run check

  svelte:
    name: Svelte build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.2
      - run: bun install --frozen-lockfile
      - run: bun run build:ui:svelte
